name: Auto Update CineSubz Movies Data

on:
  schedule:
    # සෑම පැය 6කට වරක්ම ස්වයංක්‍රීයව අලුත් Movies Update වේ
    - cron: '0 */6 * * *'
  workflow_dispatch: # Actions Tab එකෙන් manual run කිරීමට

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run CineSubz Scraper
      run: python scraper.py

    - name: Commit and Push Changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add movies.json
        git diff-index --quiet HEAD || git commit -m "Auto-update CineSubz movies data"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
