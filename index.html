<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNN NETWORK MOVIE LK</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="logo">
            <h1>BNN NETWORK <span>MOVIE LK</span></h1>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="චිත්‍රපට හෝ ටෙලි නාට්‍ය සොයන්න..." onkeyup="searchMovies()">
            <button><i class="fas fa-search"></i></button>
        </div>
    </header>

    <!-- Source Selector Navigation -->
    <nav class="source-nav">
        <button class="active" onclick="filterSource('all')">සියල්ල (All)</button>
        <button onclick="filterSource('sinhalasub')">SinhalaSub.LK</button>
        <button onclick="filterSource('baiscope')">Baiscope Sinhala</button>
        <button onclick="filterSource('subz')">Subz LK</button>
    </nav>

    <!-- Movies Grid Container -->
    <main class="container">
        <div id="movieGrid" class="movie-grid">
            <!-- Movie Cards Will Be Inserted Here Dynamically -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 BNN NETWORK MOVIE LK - All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
